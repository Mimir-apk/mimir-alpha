# MIMIR-REWRITE — root gradle properties.

# JVM: give Gradle enough heap; file.encoding for deterministic builds.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Faster, more predictable builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX is mandatory for Compose/Room.
android.useAndroidX=true

# Non-transitive R classes: each module gets only its own resources in R — smaller,
# faster, prevents cross-module resource leakage (recommended for multi-module).
android.nonTransitiveRClass=true

# Do NOT enable Jetifier — no legacy support-library deps in this greenfield project.
android.enableJetifier=false

# Kotlin: use the official code style.
kotlin.code.style=official

# POSTURE NOTE (build-time only): if a dependency won't resolve offline, STOP and
# report the exact artifact list (M1 dependency-provisioning gate). Do NOT add a
# runtime network permission to make a build succeed. See MIMIR_REWRITE_POSTURE_MANIFEST.md.
