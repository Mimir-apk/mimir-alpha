android.useAndroidX=true

# The Kotlin compile daemon inherits no heap setting from this build, so it ran at its ~512m
# default and OOMed with "GC overhead limit exceeded" inside compileProductionDebugKotlin --
# meaning the documented Tweaker gate could not be run as written on 2026-08-22 without an
# ad-hoc -P override. The root build has always set org.gradle.jvmargs=-Xmx3g; this build is a
# SEPARATE Gradle build (reached with -p mimir-tweaker) and inherits none of it.
#
# A gate that does not run is not a gate. Set both explicitly here rather than leaving every
# future invocation to rediscover the override.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx3g
